[env]
platform = atmelavr
board = uno
framework = arduino

[build]
flags = -DDEBUG

[platformio]
src_dir = src
lib_dir = lib
include_dir = include
test_dir = test

[env:uno]
lib_deps = 
    accelstepper
    AccelStepperWrapper

[env:mega]
board = mega
lib_deps = 
    accelstepper
    AccelStepperWrapper

[env:custom]
platform = atmelavr
board = custom_board
lib_deps = 
    accelstepper
    AccelStepperWrapper